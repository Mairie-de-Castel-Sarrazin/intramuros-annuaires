name: Mise à jour annuaire

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer annuaire
        run: node scripts/update-annuaire.js

      - name: Afficher début HTML
        run: |
          head -n 50 debug.html
        run: cat data/annuaire-acteurs.json
